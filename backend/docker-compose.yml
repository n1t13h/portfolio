# Local stack: the API plus an S3-compatible stand-in for Cloudflare R2.
#   docker compose up --build
# API:  http://localhost:8000   (docs at /docs; debug is on locally)
# S3:   http://localhost:9090   (Adobe S3Mock: no signature checks, buckets created on start)
# Nothing here is a real secret; production values live in /etc/portfolio/backend.env.
services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: "true"
      ALLOWED_ORIGINS: '["http://localhost:5173","http://localhost:8080"]'
      ADMIN_PATH_PREFIX: local-admin-path-0123456789
      SESSION_SECRET: local-only-session-secret-change-me
      R2_ENDPOINT: http://s3:9090
      R2_PRESIGN_ENDPOINT: http://localhost:9090  # what the browser can reach
      R2_ACCESS_KEY: local
      R2_SECRET_KEY: local
      R2_PUBLIC_BUCKET: portfolio-public
      R2_PRIVATE_BUCKET: portfolio-private
      CDN_BASE_URL: http://localhost:9090/portfolio-public
      # Set these in your shell to try the real integrations locally.
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - api-data:/data
    depends_on:
      - s3

  s3:
    image: adobe/s3mock
    user: "0:0"  # the named volume is root-owned and the image's default user could not write to it
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: portfolio-public,portfolio-private
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3data
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - s3-data:/s3data

volumes:
  api-data:
  s3-data:
